<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notícias - Honestidade Online</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- O Navbar será injetado aqui automaticamente -->
    <div id="navbar-placeholder"></div>

    <main class="container flex-grow-1 py-4">
        <h1 class="text-center">Notícias de Tecnologia</h1>
        <p class="text-center">As principais notícias sobre tecnologia no mundo, em português e atualizadas automaticamente.</p>

        <!-- Filtros e atualização -->
        <section class="mb-4" aria-label="Filtros de notícias">
            <div class="row g-3 align-items-center justify-content-center">
                <div class="col-12 col-md-6 col-lg-4">
                    <label for="busca-noticias" class="visually-hidden">Buscar pelo título</label>
                    <input type="search" id="busca-noticias" class="form-control"
                        placeholder="Buscar pelo título...">
                </div>
                <div class="col-12 col-md-auto text-center">
                    <button type="button" id="btn-atualizar" class="btn btn-dark">Atualizar agora</button>
                </div>
            </div>

            <!-- Botões por fonte (criados pelo JavaScript) -->
            <div id="filtros-fonte" class="d-flex flex-wrap justify-content-center gap-2 mt-3"
                role="group" aria-label="Filtrar por fonte"></div>

            <p id="ultima-atualizacao" class="text-center text-muted small mt-3 mb-0" role="status"></p>
            <p id="aviso-fontes" class="text-center text-muted small mb-0"></p>
        </section>

        <!-- Spinner de carregamento -->
        <div id="noticias-carregando" class="text-center my-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Carregando notícias...</span>
            </div>
        </div>

        <!-- Mensagem de erro -->
        <div id="noticias-erro" class="alert alert-danger text-center d-none" role="alert">
            <p class="mb-2">Não foi possível carregar as notícias agora. Verifique sua conexão e tente novamente.</p>
            <button type="button" id="btn-tentar-novamente" class="btn btn-outline-danger btn-sm">Tentar novamente</button>
        </div>

        <!-- Nenhum resultado -->
        <p id="noticias-vazio" class="text-center d-none">Nenhuma notícia encontrada.</p>

        <!-- Lista de notícias (criada pelo JavaScript) -->
        <div id="lista-noticias" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
            aria-live="polite"></div>
    </main>

    <!-- O Footer será injetado aqui automaticamente -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Carrega o navbar e o footer -->
    <script src="javascript/main.js"></script>

    <!-- Carrega as notícias -->
    <script src="javascript/noticias.js"></script>
</body>
</html>
